name: Sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'dwproton version for the Steam build (e.g. 11.0-16); empty = latest'
        required: false
        default: ''
      runner_version:
        description: 'wine-dwproton version for the AAGL runner (e.g. 11.0-11); empty = spritz pin'
        required: false
        default: ''
      force:
        description: 'Rebuild even if the releases exist'
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Rebase backport
    runs-on: ubuntu-24.04
    outputs:
      proton_build: ${{ steps.sync.outputs.proton_build }}
      proton_version: ${{ steps.sync.outputs.proton_version }}
      runner_build: ${{ steps.sync.outputs.runner_build }}
      runner_version: ${{ steps.sync.outputs.runner_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fork-ci

      - id: sync
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RUNNER_VERSION: ${{ inputs.runner_version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: ./sync.sh

  proton:
    needs: sync
    if: always() && needs.sync.outputs.proton_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.sync.outputs.proton_version }}
    secrets: inherit

  runner:
    needs: sync
    if: always() && needs.sync.outputs.runner_build == 'true'
    uses: ./.github/workflows/runner.yml
    with:
      version: ${{ needs.sync.outputs.runner_version }}
    secrets: inherit

  components:
    name: Update components index
    needs: [sync, runner]
    if: always() && needs.runner.result != 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fork-ci

      - env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: ./components.sh
